name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Generating the client reads the schema only; the URL is a placeholder
      # that is never connected to.
      - run: npm run generate
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
      - run: npx eslint . --max-warnings 0
      - run: npx tsc --noEmit
      # Unit tests need no database (src/app/testing/testEnv.ts fills env).
      - run: npm test
      - run: npm run build

  docker:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
