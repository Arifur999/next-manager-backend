# The whole product, on one machine.
#
# Four containers behind one port: nginx is the only thing published, and it
# reaches Next and the API over a private network. That is what makes cookies
# same-origin and leaves exactly one hostname to put a certificate on.
#
# The web service builds from ../naxified, so the two repositories have to sit
# side by side - which is how they are cloned:
#
#     naxified managment/
#       naxified/           <- the web app
#       naxified_backend/   <- this, and compose lives here
#
# Copy .env.docker.example to .env.docker and fill it in, then ALWAYS pass it:
#
#     docker compose --env-file .env.docker up -d --build
#
# The flag is not optional and not decoration. Compose substitutes ${...} below
# from .env in this directory unless told otherwise, and .env here is the
# DEVELOPMENT environment - its DATABASE_URL points at localhost, which inside
# a container is the container. Without --env-file the substitutions come out
# blank and the stack builds a database with no password.

name: naxified

services:
    db:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - db-data:/var/lib/postgresql/data
        # Nothing published. The database is reachable from the other
        # containers and from nowhere else, which is the single most valuable
        # line in this file.
        healthcheck:
            # -d and -U, because bare pg_isready answers "ready" while the
            # first-run init script is still creating the database.
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 10s

    api:
        build:
            context: .
        restart: unless-stopped
        env_file:
            - .env.docker
        environment:
            # Built here rather than written in the env file, so it cannot
            # drift from the credentials the database was actually created
            # with.
            DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
            NODE_ENV: production
            PORT: 5000
        depends_on:
            db:
                # Not just "started". The entrypoint migrates before it serves,
                # and a migration against a database still running its init
                # script fails on connection rather than on SQL.
                condition: service_healthy

    web:
        build:
            context: ../naxified
            args:
                # The BROWSER's route, inlined into the bundle at build time -
                # it is what useChatSocket opens the chat WebSocket against, so
                # it has to be the address a person's browser can actually
                # reach. Rebuild after changing it; a restart will not do.
                NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_ORIGIN}/api/v1
        restart: unless-stopped
        environment:
            # The SERVER's route: straight to the API over this network, no
            # proxy hop. Read at runtime, so this one only needs a restart.
            API_INTERNAL_URL: http://api:5000/api/v1
            # proxy.ts verifies access tokens itself, so this must be the same
            # secret the API signs them with.
            JWT_ACCESS_SECRET: ${ACCESS_TOKEN_SECRET}
            NODE_ENV: production
        depends_on:
            api:
                condition: service_healthy

    nginx:
        image: nginx:1.27-alpine
        restart: unless-stopped
        ports:
            - "${HTTP_PORT:-80}:80"
            - "${HTTPS_PORT:-443}:443"
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            # The certificate and its key. Without them nginx will not start,
            # which is the right failure: a production build served over plain
            # http discards its own auth cookies and nobody can sign in.
            # .env.docker.example has the one-line openssl command for a local
            # pair.
            - ./docker/nginx/certs:/etc/nginx/certs:ro
        depends_on:
            web:
                condition: service_healthy
            api:
                condition: service_healthy

volumes:
    db-data:
