# One origin in front of two servers, over TLS.
#
# The browser only ever talks to this. /api and /ws reach the API, everything
# else reaches Next - so cookies are same-origin (no SameSite=None, no CORS
# preflight on every call) and there is exactly one hostname to certify.
#
# ── Why TLS is not optional here ───────────────────────────────────────────
#
# The API sets its auth cookies with `secure: isProduction` (app/utils/
# cookie.ts). A Secure cookie is DISCARDED by the browser over plain http, so
# a production build served on http answers 200 to a login and then bounces
# every page to /login, because nothing was ever stored. The stack does not
# half-work without a certificate; it fails in a way that reads like a bug in
# the login form.
#
# Certificates are mounted at /etc/nginx/certs. For a real deployment those
# are the ones your CA issued. For a local run, generate a self-signed pair -
# the command is in .env.docker.example.

upstream api {
    server api:5000;
}

upstream web {
    server web:3000;
}

# Plain http exists only to send people to https.
server {
    listen 80;
    server_name _;

    server_tokens off;

    # $host carries no port, so this redirects to the standard 443 - which is
    # right for any real deployment and wrong only when HTTPS_PORT has been
    # remapped for a local run. nginx cannot know the published port; Docker
    # chose it on the outside. On a remapped port, use the https URL directly.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS 1.2 and 1.3 only. Everything older is broken.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Uploads and long request bodies. Next's default is 1 MB, which is small
    # for anything a person attaches.
    client_max_body_size 25m;

    # nginx announcing its own version to the internet buys nothing.
    server_tokens off;

    # ── Security headers ───────────────────────────────────────────────────
    #
    # Set here rather than in either app, because nginx is the one thing in
    # front of both - the API and the web app would otherwise need the same
    # four headers configured twice and kept in step.
    #
    # always, so they are set on error responses too. A 500 is exactly the page
    # you do not want framed or sniffed.

    # Once a browser has seen this it refuses plain http for this host for a
    # year, which closes the window where a first request over http could be
    # intercepted. Deliberately without preload: that is a one-way door, and
    # submitting a host to the preload list is a decision to take on purpose.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Stops a browser from guessing that an uploaded .txt is really a script.
    add_header X-Content-Type-Options "nosniff" always;

    # Clickjacking. Nothing here is meant to be embedded, and an invisible
    # frame over a real session is how a person is made to click something
    # they cannot see.
    add_header X-Frame-Options "DENY" always;

    # Referrer-Policy, so a reset-password URL - which carries a token in its
    # query string - is not sent to whatever a person clicks through to next.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # No Content-Security-Policy yet, and that is a decision rather than an
    # oversight. Next inlines its bootstrap script, so a useful policy needs
    # per-request nonces threaded through the app; a policy loose enough to
    # skip that (unsafe-inline) says almost nothing while looking like it says
    # a lot. Worth doing properly, not worth faking.

    # The API. Not rewritten - the backend mounts its routes at /api/v1, so the
    # path the browser used is the path the server expects.
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # So the API knows the browser's half of the connection was https even
        # though this hop is not.
        proxy_set_header X-Forwarded-Proto $scheme;

        # A report over a wide date range is slower than a page load and must
        # not be cut off at nginx's 60s default.
        proxy_read_timeout 120s;
    }

    # The chat socket. attachChatSocket only claims /ws and leaves every other
    # upgrade alone, so this is the whole of it.
    location /ws {
        proxy_pass http://api;
        proxy_http_version 1.1;

        # The two headers that make it a WebSocket rather than a 400.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # A chat socket is idle most of the time. The default would close it
        # every minute and the client would reconnect forever.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Next's build output is content-addressed - the hash in the filename
    # changes when the file does - so it can be cached hard and forever.
    #
    # This block deliberately sets NO add_header of its own. In nginx, one
    # add_header in a location REPLACES every add_header inherited from the
    # server block - so a Cache-Control here silently stripped all four
    # security headers off every script and stylesheet. Measured: the page
    # carried them and the assets carried none.
    #
    # Nothing is lost by dropping it. Next already sends exactly
    # "public, max-age=31536000, immutable" on these files itself, so the
    # directive was duplicating a header the upstream had already set.
    location /_next/static/ {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Everything else is the app.
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next streams RSC payloads. Buffering them would hold the whole
        # response before sending a byte and undo the streaming.
        proxy_buffering off;
    }
}
